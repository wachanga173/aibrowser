name: Automatic Production Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Release Verification Suite
        run: |
          npm ci
          npm run verify:release

      - name: Dynamic Version Extraction
        id: dynamic_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_TAG=v${PKG_VERSION}" >> $GITHUB_ENV

      - name: Package Chrome Extension Distribution ZIP
        run: |
          cd dist/chrome-extension && zip -r ../../chrome-extension.zip . && cd ../..

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Privacy Guard ${{ env.RELEASE_TAG }}
          body: |
            Automatic production release for Privacy AI Guard.
            Features dynamic background updates, static DNR ad blocking, WASM fingerprinting heuristics, and local AI.
          files: |
            chrome-extension.zip
            updates.xml
            scripts/install-native-host.bat
            scripts/install-native-host.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
