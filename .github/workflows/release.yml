name: Automatic Production Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MinGW Cross-Compiler (for Windows binary on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cross-Compile Native Host Binary (Windows)
        run: |
          cd native-host
          cargo build --release --target x86_64-pc-windows-gnu --bin native_host_binary
          cp target/x86_64-pc-windows-gnu/release/native_host_binary.exe ../native_host_binary.exe
          echo "Native host binary compiled successfully"

      - name: Compute Dynamic Release Version
        id: dynamic_version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          DYNAMIC_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "BUILD_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${DYNAMIC_VERSION}" >> $GITHUB_ENV
          echo "Computed Dynamic Build Version: v${DYNAMIC_VERSION}"

      - name: Install Dependencies & Run Release Verification Suite
        run: |
          npm ci
          npm run verify:release
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}

      - name: Commit updated updates.xml to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --cached --quiet || git commit -m "chore: update updates.xml to ${{ env.RELEASE_TAG }}"
          git push origin HEAD:main


      - name: Package Chrome & Firefox Extension Distribution ZIPs
        run: |
          cd dist/chrome-extension && zip -r ../../chrome-extension.zip . && cd ../..
          cd dist/firefox-extension && zip -r ../../firefox-extension.zip . && cd ../..

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Privacy Guard ${{ env.RELEASE_TAG }}
          make_latest: true
          body: |
            Automatic production release for Privacy AI Guard (Version ${{ env.RELEASE_TAG }}).
            Features dynamic background updates, static DNR ad blocking, WASM fingerprinting heuristics, local AI Browser Agent, and RAM Analytics.

            ## First-Time Setup for Automatic Updates
            1. Download `setup-native-host.bat` below
            2. Place it in the same folder as your extension
            3. Double-click to run it
            4. All future updates will work with one click from the extension popup
          files: |
            chrome-extension.zip
            firefox-extension.zip
            updates.xml
            native_host_binary.exe
            scripts/setup-native-host.bat
            scripts/install-native-host.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

