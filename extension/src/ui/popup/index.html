<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy AI Guard</title>
  <link rel="stylesheet" href="../../../design-system/tokens.css">
  <style>
    body {
      width: 340px;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shield-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--shield-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .brand-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .brand-subtitle {
      font-size: 11px;
      color: var(--text-secondary-dark);
      margin: 0;
    }
    .status-card {
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .stat-number {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 700;
      color: var(--primary-accent);
      margin: 8px 0;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-secondary-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--shield-green);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary-dark);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      text-align: center;
    }
    .btn:hover {
      background: var(--primary-accent);
      border-color: var(--primary-accent);
      color: white;
    }
  </style>
</head>
<body class="dark-theme">
  <div class="header">
    <div class="brand">
      <div id="shieldIcon" class="shield-icon shield-active">🛡️</div>
      <div>
        <h1 class="brand-title">Privacy Guard</h1>
        <p class="brand-subtitle">Zero-Telemetry Active</p>
      </div>
    </div>
  </div>

  <div class="glass-card toggle-container">
    <span class="toggle-label">Protection Shield</span>
    <label class="switch">
      <input type="checkbox" id="blockingToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="glass-card status-card">
    <div class="stat-label">Items Blocked Today</div>
    <div id="blockedCount" class="stat-number">0</div>
    <div class="brand-subtitle" id="logCountLabel">0 local activity logs stored</div>
  </div>

  <div class="btn-group">
    <button id="openActivityLogBtn" class="btn">Activity Log</button>
    <button id="openOptionsBtn" class="btn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
