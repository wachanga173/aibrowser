<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy AI Guard</title>
  <link rel="stylesheet" href="../../../design-system/tokens.css">
  <style>
    body {
      width: 340px;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shield-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--shield-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .brand-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .brand-subtitle {
      font-size: 11px;
      color: var(--text-secondary-dark);
      margin: 0;
    }
    .status-card {
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .stat-number {
      font-family: var(--font-heading);
      font-size: 36px;
      font-weight: 700;
      color: var(--primary-accent);
      margin: 8px 0;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-secondary-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--shield-green);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary-dark);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
      text-align: center;
    }
    .btn:hover {
      background: var(--primary-accent);
      border-color: var(--primary-accent);
      color: white;
    }
    .prompt-card {
      padding: 14px;
      margin-bottom: 16px;
    }
    .prompt-title {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prompt-textarea {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-primary-dark);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 8px;
      font-family: var(--font-body);
      font-size: 12px;
      resize: none;
      outline: none;
      transition: var(--transition-fast);
    }
    .prompt-textarea:focus {
      border-color: var(--primary-accent);
    }
    .btn-ai {
      width: 100%;
      margin-top: 8px;
      background: var(--primary-accent);
      color: white;
      border: none;
    }
    .btn-ai:hover {
      opacity: 0.95;
    }
    .ai-response {
      display: none;
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-dark);
      padding: 10px;
      border-radius: 6px;
      max-height: 140px;
      overflow-y: auto;
      word-break: break-word;
    }
  </style>
</head>
<body class="dark-theme">
  <div id="updateBanner" style="display: none; background: rgba(129, 140, 248, 0.15); border: 1px solid var(--primary-accent); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 12px; justify-content: space-between; align-items: center;">
    <div>
      <strong style="color: var(--primary-accent);">New Update Available</strong>
      <div id="updateVersionText" style="font-size: 10px; color: var(--text-secondary-dark);">New software version is ready to install</div>
    </div>
    <a id="updateDownloadLink" href="https://github.com/wachanga173/aibrowser/releases/latest" target="_blank" class="btn" style="padding: 6px 10px; font-size: 11px; text-decoration: none; background: var(--primary-accent); color: white; flex: none;">Get Update</a>
  </div>

  <div class="header">
    <div class="brand">
      <div id="shieldIcon" class="shield-icon shield-active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <h1 class="brand-title">Privacy Guard</h1>
        <p class="brand-subtitle">Zero-Telemetry Active</p>
      </div>
    </div>
  </div>

  <div class="glass-card toggle-container">
    <span class="toggle-label">Protection Shield</span>
    <label class="switch">
      <input type="checkbox" id="blockingToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="glass-card prompt-card">
    <div class="prompt-title">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
      Local AI Page Q&A
    </div>
    <textarea id="aiPromptInput" class="prompt-textarea" placeholder="Ask a question about this page..." rows="2"></textarea>
    <button id="askAiBtn" class="btn btn-ai">Ask AI (Offline)</button>
    <div id="aiResponseArea" class="ai-response"></div>
  </div>

  <div class="glass-card status-card">
    <div class="stat-label">Items Blocked Today</div>
    <div id="blockedCount" class="stat-number">0</div>
    <div class="brand-subtitle" id="logCountLabel">0 local activity logs stored</div>
  </div>

  <div class="btn-group">
    <button id="openActivityLogBtn" class="btn">Activity Log</button>
    <button id="openOptionsBtn" class="btn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
