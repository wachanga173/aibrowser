[package]
name = "native-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "fingerprint_detector"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native_host_binary"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2.92"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
